# Network Port Alert Rules (Reduced for Homelab)
# Focuses on critical changes and security issues
# Full version archived in: archived/port-alerts.yml.full

groups:
  - name: network_exposure
    interval: 30s
    rules:
      # ==========================================================================
      # NETWORK CONNECTION MONITORING
      # ==========================================================================
      - alert: HighEstablishedConnections
        expr: node_netstat_Tcp_CurrEstab > 1000
        for: 5m
        labels:
          severity: warning
          category: network
          alert_type: performance
        annotations:
          summary: "High number of established TCP connections"
          description: "{{ $value }} established TCP connections. May indicate connection leak or DDoS."
          runbook_url: "https://wiki.internal.com/infrastructure/high-connections"

      - alert: SynFloodPossible
        expr: rate(node_netstat_Tcp_InSegs[1m]) > 1000
        for: 2m
        labels:
          severity: critical
          category: network
          alert_type: security
        annotations:
          summary: "Possible SYN flood attack detected"
          description: "High rate of incoming TCP segments ({{ $value | printf \"%.0f\" }}/sec). May indicate SYN flood attack."
          runbook_url: "https://wiki.internal.com/security/syn-flood"

      # ==========================================================================
      # SOCKET EXHAUSTION
      # ==========================================================================
      - alert: TCPSocketExhaustion
        expr: |
          (
            node_sockstat_TCP_inuse / node_sockstat_sockets_used * 100
          ) > 80
        for: 5m
        labels:
          severity: critical
          category: network
          alert_type: performance
        annotations:
          summary: "TCP socket exhaustion detected"
          description: "{{ $value | printf \"%.1f\" }}% of available sockets in use. System may refuse new connections."
          runbook_url: "https://wiki.internal.com/infrastructure/socket-exhaustion"

      # ==========================================================================
      # TIME_WAIT SOCKET ACCUMULATION
      # ==========================================================================
      - alert: HighTimeWaitSockets
        expr: node_sockstat_TCP_tw > 5000
        for: 5m
        labels:
          severity: warning
          category: network
          alert_type: performance
        annotations:
          summary: "High number of TIME_WAIT sockets"
          description: "{{ $value }} sockets in TIME_WAIT state. May indicate connection churn or need for tuning."
          runbook_url: "https://wiki.internal.com/infrastructure/time-wait-sockets"

      # ==========================================================================
      # UDP ANOMALIES
      # ==========================================================================
      - alert: UDPBufferErrors
        expr: rate(node_netstat_Udp_RcvbufErrors[5m]) > 1
        for: 2m
        labels:
          severity: warning
          category: network
          alert_type: performance
        annotations:
          summary: "UDP receive buffer errors detected"
          description: "{{ $value | printf \"%.2f\" }} UDP receive buffer errors/sec. Packets are being dropped."
          runbook_url: "https://wiki.internal.com/infrastructure/udp-buffer-errors"
