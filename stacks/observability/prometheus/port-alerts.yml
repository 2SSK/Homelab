# Network Port Alert Rules
# Detect new listening ports and unexpected service exposure

groups:
  - name: network_exposure
    interval: 30s
    rules:
      # ==========================================================================
      # TCP SOCKET MONITORING
      # ==========================================================================
      - alert: TCPSocketCountChange
        expr: |
          abs(delta(node_sockstat_TCP_inuse[5m])) > 5
        for: 2m
        labels:
          severity: info
          category: network
          alert_type: monitoring
        annotations:
          summary: "Significant change in TCP socket count"
          description: "TCP socket count changed by {{ $value }} in the last 5 minutes. Current: {{ query \"node_sockstat_TCP_inuse\" | first | value }}"
          runbook_url: "https://wiki.internal.com/monitoring/socket-change"

      # ==========================================================================
      # NETWORK CONNECTION STATE MONITORING
      # ==========================================================================
      - alert: HighEstablishedConnections
        expr: node_netstat_Tcp_CurrEstab > 1000
        for: 5m
        labels:
          severity: warning
          category: network
          alert_type: performance
        annotations:
          summary: "High number of established TCP connections"
          description: "{{ $value }} established TCP connections. May indicate connection leak or DDoS."
          runbook_url: "https://wiki.internal.com/infrastructure/high-connections"

      - alert: SynFloodPossible
        expr: rate(node_netstat_Tcp_InSegs[1m]) > 1000
        for: 2m
        labels:
          severity: critical
          category: network
          alert_type: security
        annotations:
          summary: "Possible SYN flood attack detected"
          description: "High rate of incoming TCP segments ({{ $value | printf \"%.0f\" }}/sec). May indicate SYN flood attack."
          runbook_url: "https://wiki.internal.com/security/syn-flood"

      # ==========================================================================
      # SOCKET EXHAUSTION
      # ==========================================================================
      - alert: TCPSocketExhaustion
        expr: |
          (
            node_sockstat_TCP_inuse / node_sockstat_sockets_used * 100
          ) > 80
        for: 5m
        labels:
          severity: critical
          category: network
          alert_type: performance
        annotations:
          summary: "TCP socket exhaustion detected"
          description: "{{ $value | printf \"%.1f\" }}% of available sockets in use. System may refuse new connections."
          runbook_url: "https://wiki.internal.com/infrastructure/socket-exhaustion"

      - alert: HighSocketUsage
        expr: node_sockstat_sockets_used > 10000
        for: 5m
        labels:
          severity: warning
          category: network
          alert_type: performance
        annotations:
          summary: "High socket usage detected"
          description: "{{ $value }} total sockets in use. Monitor for socket leaks."
          runbook_url: "https://wiki.internal.com/infrastructure/high-socket-usage"

      # ==========================================================================
      # PORT CHURN DETECTION
      # ==========================================================================
      - alert: HighPortChurnRate
        expr: |
          abs(deriv(node_sockstat_TCP_inuse[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: network
          alert_type: anomaly
        annotations:
          summary: "High rate of TCP port changes detected"
          description: "TCP ports are being opened/closed at an unusual rate. May indicate port scanning or service instability."
          runbook_url: "https://wiki.internal.com/security/port-churn"

      # ==========================================================================
      # NETWORK ERRORS
      # ==========================================================================
      - alert: HighTCPRetransmissions
        expr: rate(node_netstat_Tcp_RetransSegs[5m]) > 100
        for: 5m
        labels:
          severity: warning
          category: network
          alert_type: performance
        annotations:
          summary: "High TCP retransmission rate"
          description: "{{ $value | printf \"%.0f\" }} TCP retransmissions/sec. Network quality issues or congestion."
          runbook_url: "https://wiki.internal.com/infrastructure/tcp-retransmissions"

      - alert: TCPConnectionResets
        expr: rate(node_netstat_Tcp_AttemptFails[5m]) > 50
        for: 5m
        labels:
          severity: warning
          category: network
          alert_type: performance
        annotations:
          summary: "High TCP connection reset rate"
          description: "{{ $value | printf \"%.0f\" }} TCP connection failures/sec. May indicate service issues or attacks."
          runbook_url: "https://wiki.internal.com/infrastructure/tcp-resets"

      # ==========================================================================
      # UDP MONITORING
      # ==========================================================================
      - alert: HighUDPSocketUsage
        expr: node_sockstat_UDP_inuse > 100
        for: 5m
        labels:
          severity: info
          category: network
          alert_type: monitoring
        annotations:
          summary: "High UDP socket usage"
          description: "{{ $value }} UDP sockets in use. Verify if expected."
          runbook_url: "https://wiki.internal.com/monitoring/udp-sockets"

      - alert: UDPErrorRate
        expr: rate(node_netstat_Udp_InErrors[5m]) > 10
        for: 5m
        labels:
          severity: warning
          category: network
          alert_type: performance
        annotations:
          summary: "High UDP error rate"
          description: "{{ $value | printf \"%.0f\" }} UDP errors/sec. Check for UDP service issues."
          runbook_url: "https://wiki.internal.com/infrastructure/udp-errors"

      # ==========================================================================
      # LISTENING SERVICES (requires textfile collector)
      # ==========================================================================
