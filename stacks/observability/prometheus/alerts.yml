# Prometheus Alert Rules
# Production alerts for homelab monitoring

groups:
  # ==========================================================================
  # HOST ALERTS
  # ==========================================================================
  - name: host
    rules:
      # High CPU usage
      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU load is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

      - alert: HostCriticalCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU load on {{ $labels.instance }}"
          description: "CPU load is above 95% (current: {{ $value | printf \"%.1f\" }}%)"

      # High memory usage
      - alert: HostHighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

      - alert: HostCriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 95% (current: {{ $value | printf \"%.1f\" }}%)"

      # Disk space
      - alert: HostDiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk usage is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

      - alert: HostDiskSpaceCritical
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk usage is above 90% (current: {{ $value | printf \"%.1f\" }}%)"

      # Disk will fill in 24 hours (predictive)
      - alert: HostDiskWillFillIn24Hours
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk will fill within 24 hours on {{ $labels.instance }}"
          description: "Based on current trend, disk will be full within 24 hours"

      # High load average
      - alert: HostHighLoadAverage
        expr: node_load5 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High load average on {{ $labels.instance }}"
          description: "5-minute load average is very high (current: {{ $value | printf \"%.2f\" }})"

      # Host down
      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} is down"
          description: "Node exporter is not responding"

      # System clock out of sync
      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clock skew detected on {{ $labels.instance }}"
          description: "System clock is off by {{ $value | printf \"%.3f\" }} seconds"

      # High network errors
      - alert: HostNetworkErrors
        expr: rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Network errors on {{ $labels.instance }}"
          description: "Network interface is reporting errors"

  # ==========================================================================
  # CONTAINER ALERTS
  # ==========================================================================
  - name: containers
    rules:
      # Container down
      - alert: ContainerDown
        expr: absent(container_last_seen{name!=""})
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container has been down for more than 1 minute"

      # Container high CPU
      - alert: ContainerHighCpu
        expr: sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU usage"
          description: "Container CPU usage is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

      # Container high memory
      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory usage"
          description: "Container memory usage is above 80% of limit"

      # Container restarting
      - alert: ContainerRestarting
        expr: increase(container_restart_count{name!=""}[1h]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting frequently"
          description: "Container has restarted {{ $value }} times in the last hour"

  # ==========================================================================
  # PROMETHEUS ALERTS
  # ==========================================================================
  - name: prometheus
    rules:
      # Prometheus target down
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} of job {{ $labels.job }} is down"

      # Prometheus configuration reload failed
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus config reload failed"
          description: "Prometheus configuration reload has failed"

      # Alertmanager down
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down"
          description: "Alertmanager is not responding"

  # ==========================================================================
  # OBSERVABILITY STACK HEALTH & CAPACITY
  # ==========================================================================
  - name: observability_health
    rules:
      # Dead man's switch - ensures alerting is working
      - alert: DeadMansSwitch
        expr: vector(1)
        labels:
          severity: info
        annotations:
          summary: "Observability stack is healthy"
          description: "This alert always fires - if you stop receiving it, alerting is broken"

      # Prometheus TSDB approaching capacity
      - alert: PrometheusTSDBNearFull
        expr: prometheus_tsdb_storage_blocks_bytes / 5000000000 > 0.8
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB at {{ $value | humanizePercentage }} capacity"
          description: "Prometheus time series database is using {{ $value | humanizePercentage }} of 5GB limit"

      # Prometheus TSDB critical
      - alert: PrometheusTSDBCritical
        expr: prometheus_tsdb_storage_blocks_bytes / 5000000000 > 0.9
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus TSDB at {{ $value | humanizePercentage }} capacity - CRITICAL"
          description: "Prometheus TSDB will stop accepting new data soon. Clean up old data or increase retention."

      # Observability data directory disk space low
      - alert: ObservabilityDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint=~"/srv/data/observability|/srv"} 
          / node_filesystem_size_bytes{mountpoint=~"/srv/data/observability|/srv"}) < 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Observability disk space low on {{ $labels.mountpoint }}"
          description: "Only {{ $value | humanizePercentage }} space remaining on {{ $labels.mountpoint }}"

      # Observability data directory disk space critical
      - alert: ObservabilityDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{mountpoint=~"/srv/data/observability|/srv"} 
          / node_filesystem_size_bytes{mountpoint=~"/srv/data/observability|/srv"}) < 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Observability disk space CRITICAL on {{ $labels.mountpoint }}"
          description: "Only {{ $value | humanizePercentage }} space remaining - immediate action required"

      # Loki ingestion rate too high
      - alert: LokiHighIngestionRate
        expr: rate(loki_ingester_bytes_received_total[5m]) > 10485760  # 10MB/s
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Loki ingesting {{ $value | humanize1024 }}B/s - unusually high"
          description: "Check for log storms or increase Loki resources"

      # Alert manager notification failures
      - alert: AlertmanagerNotificationsFailing
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager failing to send notifications"
          description: "{{ $value }} notification failures per second - check SMTP config"

