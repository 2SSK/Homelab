# Process Monitoring Alert Rules
# Detect unexpected and suspicious processes

groups:
  - name: process_monitoring
    interval: 60s
    rules:
      # ==========================================================================
      # UNEXPECTED PROCESSES
      # ==========================================================================

      - alert: UnexpectedProcessDetected
        expr: unexpected_processes_count > 0
        for: 5m
        labels:
          severity: warning
          category: process
          alert_type: monitoring
        annotations:
          summary: "{{ $value }} unexpected process(es) detected"
          description: "Processes running that are not in the baseline. Check /var/log/syslog for process names."
          runbook_url: "https://wiki.internal.com/security/unexpected-process"

      # ==========================================================================
      # HIGH-RISK PROCESSES
      # ==========================================================================

      - alert: ReverseShellDetected
        expr: |
          count_over_time({job="syslog", process="process_monitor"} |~ "(nc|ncat|socat|bash -i|/dev/tcp)" [5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: process
          alert_type: security
        annotations:
          summary: "Potential reverse shell detected"
          description: "Process indicative of reverse shell detected: {{ $labels.new_process_name }}"
          runbook_url: "https://wiki.internal.com/security/reverse-shell"

      - alert: CryptoMinerDetected
        expr: |
          count_over_time({job="syslog", process="process_monitor"} |~ "(xmrig|minerd|cpuminer|ethminer|cgminer)" [5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: process
          alert_type: security
        annotations:
          summary: "Cryptocurrency miner detected"
          description: "Crypto mining process detected: {{ $labels.new_process_name }}. Potential compromise."
          runbook_url: "https://wiki.internal.com/security/crypto-miner"

      - alert: NetworkScannerDetected
        expr: |
          count_over_time({job="syslog", process="process_monitor"} |~ "(nmap|masscan|zmap|nikto)" [5m]) > 0
        for: 0m
        labels:
          severity: high
          category: process
          alert_type: security
        annotations:
          summary: "Network scanning tool detected"
          description: "Network scanner detected: {{ $labels.new_process_name }}. May be legitimate or recon activity."
          runbook_url: "https://wiki.internal.com/security/network-scanner"

      # ==========================================================================
      # PROCESS COUNT ANOMALIES
      # ==========================================================================

      - alert: ProcessCountSpike
        expr: |
          count(namedprocess_namegroup_num_procs) > 500
        for: 10m
        labels:
          severity: warning
          category: process
          alert_type: performance
        annotations:
          summary: "Abnormally high process count"
          description: "{{ $value }} processes running. Normal is typically < 500. May indicate fork bomb or resource exhaustion."
          runbook_url: "https://wiki.internal.com/performance/high-process-count"

      # ==========================================================================
      # SHORT-LIVED PROCESSES (POTENTIAL PERSISTENCE)
      # ==========================================================================

      - alert: ShortLivedProcesses
        expr: |
          count_over_time({job="syslog", process="process_monitor"} |~ "New process detected" [5m]) > 10
        for: 5m
        labels:
          severity: info
          category: process
          alert_type: monitoring
        annotations:
          summary: "High rate of short-lived processes"
          description: "{{ $value }} new processes detected in 5 minutes. May be normal activity or persistence mechanism."
          runbook_url: "https://wiki.internal.com/security/short-lived-processes"
