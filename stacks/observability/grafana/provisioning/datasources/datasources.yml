# Grafana Datasource Provisioning
# Auto-configure Prometheus and Loki datasources
#
# IMPORTANT: All datasources use stable UIDs for dashboard portability
# - Dashboards can be exported/imported without datasource remapping
# - UIDs remain consistent across Grafana restarts
# - See: docs/adr/0002-datasource-uid-stability.md

apiVersion: 1

datasources:
  # Prometheus - Metrics
  - name: Prometheus
    uid: prometheus  # Stable UID for dashboard portability
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.48.0"

  # Loki - Logs
  - name: Loki
    uid: loki  # Stable UID for dashboard portability
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "container_id=(\\w+)"
          name: ContainerID
          url: "$${__value.raw}"

  # Alertmanager
  - name: Alertmanager
    uid: alertmanager  # Stable UID for dashboard portability
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
