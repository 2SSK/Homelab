# Promtail Configuration
# Ships logs to Loki from host and containers

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Persistent positions file - survives container restarts
  # Mounted to /srv/data/observability/promtail on host
  filename: /var/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ==========================================================================
  # SYSTEM LOGS
  # ==========================================================================
  
  # Syslog
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: homelab
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\w+)\s+(?P<process>[\w\-\[\]]+):\s+(?P<message>.*)$'
      - labels:
          hostname:
          process:
      - timestamp:
          source: timestamp
          format: 'Jan _2 15:04:05'

  # Auth log (SSH monitoring)
  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          host: homelab
          __path__: /var/log/auth.log
    pipeline_stages:
      # Extract timestamp, hostname, process, and message
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\w+)\s+(?P<process>[\w\-\[\]]+):\s+(?P<message>.*)$'
      - labels:
          hostname:
          process:
      
      # SSH Authentication Monitoring - 14 Pattern Regex
      
      # Pattern 1: Accepted password login
      - regex:
          expression: 'Accepted password for (?P<ssh_username>\w+) from (?P<ssh_ip>[\d\.]+) port (?P<ssh_port>\d+) ssh2'
          source: message
      - labels:
          ssh_username:
          ssh_ip:
      - labels:
          ssh_event_type: Accepted
      
      # Pattern 2: Failed password login
      - regex:
          expression: 'Failed password for (?P<ssh_username>\w+) from (?P<ssh_ip>[\d\.]+) port (?P<ssh_port>\d+) ssh2'
          source: message
      - labels:
          ssh_username:
          ssh_ip:
      - labels:
          ssh_event_type: Failed
      
      # Pattern 3: Invalid user attempt
      - regex:
          expression: 'Invalid user (?P<ssh_username>\w+) from (?P<ssh_ip>[\d\.]+) port (?P<ssh_port>\d+)'
          source: message
      - labels:
          ssh_username:
          ssh_ip:
      - labels:
          ssh_event_type: Invalid
      
      # Pattern 4: Root login attempt
      - regex:
          expression: '(Accepted|Failed) (password|publickey) for (root|(?P<ssh_username>\w+)) from (?P<ssh_ip>[\d\.]+)'
          source: message
      - labels:
          ssh_username:
          ssh_ip:
      - regex:
          expression: '(root) from (?P<ssh_ip>[\d\.]+)'
          source: message
      - labels:
          ssh_event_type: RootLogin
      
      # Pattern 5: Public key authentication
      - regex:
          expression: 'Accepted publickey for (?P<ssh_username>\w+) from (?P<ssh_ip>[\d\.]+) port (?P<ssh_port>\d+) ssh2'
          source: message
      - labels:
          ssh_username:
          ssh_ip:
      - labels:
          ssh_event_type: Accepted
      
      # Pattern 6: Connection closed
      - regex:
          expression: 'Disconnected from (?P<ssh_ip>[\d\.]+) port (?P<ssh_port>\d+)'
          source: message
      - labels:
          ssh_ip:
      - labels:
          ssh_event_type: Disconnected
      
      # Pattern 7: Session opened
      - regex:
          expression: 'session opened for user (?P<ssh_username>\w+) by (?:\(uid=\d+\)|(?P<ssh_method>\w+))'
          source: message
      - labels:
          ssh_username:
          ssh_method:
      - labels:
          ssh_event_type: SessionOpened
      
      # Pattern 8: Session closed
      - regex:
          expression: 'session closed for user (?P<ssh_username>\w+)'
          source: message
      - labels:
          ssh_username:
      - labels:
          ssh_event_type: SessionClosed
      
      # Pattern 9: PAM authentication failure
      - regex:
          expression: 'pam_unix\(sshd:auth\): authentication failure; logname=\S* uid=\d+ euid=\d+ tty=\S* ruser=\S* rhost=(?P<ssh_ip>[\d\.]+)'
          source: message
      - labels:
          ssh_ip:
      - labels:
          ssh_event_type: PamFailure
      
      # Pattern 10: Too many authentication failures
      - regex:
          expression: 'Too many authentication failures for (?P<ssh_username>\w+) from (?P<ssh_ip>[\d\.]+) port (?P<ssh_port>\d+)'
          source: message
      - labels:
          ssh_username:
          ssh_ip:
      - labels:
          ssh_event_type: TooManyFailures
      
      # Pattern 11: Break-in attempt
      - regex:
          expression: '(Break-in attempt|POSSIBLE BREAK-IN ATTEMPT)'
          source: message
      - labels:
          ssh_event_type: BreakInAttempt
      
      # Pattern 12: Maximum authentication attempts exceeded
      - regex:
          expression: 'Maximum authentication attempts exceeded'
          source: message
      - labels:
          ssh_event_type: MaxAttemptsExceeded
      
      # Pattern 13: User not allowed because account is locked
      - regex:
          expression: 'User (?P<ssh_username>\w+) not allowed because account is locked'
          source: message
      - labels:
          ssh_username:
      - labels:
          ssh_event_type: AccountLocked
      
      # Pattern 14: Preauth error
      - regex:
          expression: 'error: maximum authentication attempts exceeded for (?P<ssh_username>\w+) from (?P<ssh_ip>[\d\.]+) port \d+ ssh2'
          source: message
      - labels:
          ssh_username:
          ssh_ip:
      - labels:
          ssh_event_type: MaxAttemptsExceeded
      
      # ==========================================================================
      # SUDO COMMAND MONITORING (Phase 4)
      # ==========================================================================
      - match:
          selector: '{job="auth", process="sudo"}'
          stages:
            # Pattern 1: Successful sudo execution
            - regex:
                expression: '^\s*(?P<sudo_user>\w+) : TTY=(?P<sudo_tty>[\w/]+) ; PWD=(?P<sudo_pwd>[^ ]+) ; USER=(?P<sudo_target_user>\w+) ; COMMAND=(?P<sudo_command>.*)$'
                source: message
            - labels:
                sudo_user:
                sudo_target_user:
                sudo_command:
                sudo_tty:
                sudo_pwd:
            - labels:
                sudo_result: success
            
            # Pattern 2: Failed sudo (incorrect password)
            - regex:
                expression: '^\s*(?P<sudo_user>\w+) : (?P<sudo_attempts>\d+) incorrect password attempt'
                source: message
            - labels:
                sudo_user:
            - labels:
                sudo_result: failed
            
            # Pattern 3: Sudo session opened
            - regex:
                expression: 'pam_unix\(sudo:session\): session opened for user (?P<sudo_target_user>\w+) by (?P<sudo_user>\w+)\(uid=(?P<sudo_uid>\d+)\)'
                source: message
            - labels:
                sudo_user:
                sudo_target_user:
            - labels:
                sudo_result: session_opened
            
            # Pattern 4: Sudo session closed
            - regex:
                expression: 'pam_unix\(sudo:session\): session closed for user (?P<sudo_target_user>\w+)'
                source: message
            - labels:
                sudo_target_user:
            - labels:
                sudo_result: session_closed
            
            # Pattern 5: Command not allowed (sudo denial)
            - regex:
                expression: '^\s*(?P<sudo_user>\w+) : command not allowed'
                source: message
            - labels:
                sudo_user:
            - labels:
                sudo_result: denied
      
      # SUDO WITHOUT TTY DETECTION (potential scripted attack)
      - match:
          selector: '{job="auth", process="sudo"} |~ "TTY=unknown"'
          stages:
            - labels:
                sudo_warning: no_tty

  # Kernel log
  - job_name: kernel
    static_configs:
      - targets:
          - localhost
        labels:
          job: kernel
          host: homelab
          __path__: /var/log/kern.log

  # ==========================================================================
  # FAIL2BAN LOGS - NEW
  # ==========================================================================
  - job_name: fail2ban
    static_configs:
      - targets:
          - localhost
        labels:
          job: fail2ban
          host: homelab
          __path__: /var/log/fail2ban.log
    pipeline_stages:
      # Extract timestamp and process
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+)\s+(?P<process>\w+)\s+(?P<message>.*)$'
      - labels:
          process:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
      
      # Pattern 1: Ban event - IP banned by jail
      - regex:
          expression: 'Ban (?P<fail2ban_ip>[\d\.]+)'
          source: message
      - labels:
          fail2ban_ip:
      - labels:
          fail2ban_event: Ban
      
      # Pattern 2: Unban event - IP unbanned
      - regex:
          expression: 'Unban (?P<fail2ban_ip>[\d\.]+)'
          source: message
      - labels:
          fail2ban_ip:
      - labels:
          fail2ban_event: Unban
      
      # Pattern 3: Jail name extraction
      - regex:
          expression: '\[(?P<fail2ban_jail>[\w\-]+)\]'
          source: message
      - labels:
          fail2ban_jail:
      
      # Pattern 4: Stop event - Fail2ban stopped
      - regex:
          expression: 'Stopping\.\.\.'
          source: message
      - labels:
          fail2ban_event: Stop
      
      # Pattern 5: Start event - Fail2ban started
      - regex:
          expression: 'Starting\.\.\.'
          source: message
      - labels:
          fail2ban_event: Start
      
      # Pattern 6: Reload event - Fail2ban reloaded
      - regex:
          expression: 'Reloading\.\.\.'
          source: message
      - labels:
          fail2ban_event: Reload
      
      # Pattern 7: Ignore event - IP added to ignore list
      - regex:
          expression: 'Ignore (?P<fail2ban_ip>[\d\.]+)'
          source: message
      - labels:
          fail2ban_ip:
      - labels:
          fail2ban_event: Ignore
      
      # Pattern 8: Restore event - Bans restored after restart
      - regex:
          expression: 'Restore (?P<fail2ban_ip>[\d\.]+)'
          source: message
      - labels:
          fail2ban_ip:
      - labels:
          fail2ban_event: Restore
      
      # Pattern 9: Ban duration extraction (e.g., "10m", "1h", "1d")
      - regex:
          expression: 'for (?P<fail2ban_duration>[\d]+[smhd])'
          source: message
      - labels:
          fail2ban_duration:
      
      # Pattern 10: Ban reason extraction
      - regex:
          expression: 'Ban (?P<fail2ban_ip>[\d\.]+).*(?P<fail2ban_reason>.*)'
          source: message
      - labels:
          fail2ban_reason:
      
      # Pattern 11: Jail status
      - regex:
          expression: "Jail '(?P<fail2ban_jail>[\\w\\-]+)' (started|stopped|reloaded)"
          source: message
      - labels:
          fail2ban_jail:
      
      # Pattern 12: Action executed (e.g., iptables, nftables)
      - regex:
          expression: 'Action: (?P<fail2ban_action>[\w\-]+)'
          source: message
      - labels:
          fail2ban_action:
      
      # Pattern 13: Ban count per IP
      - regex:
          expression: 'Banned (?P<fail2ban_ip>[\d\.]+) \((?P<fail2ban_ban_count>\d+) bans?\)'
          source: message
      - labels:
          fail2ban_ban_count:

  # ==========================================================================
  # DOCKER CONTAINER LOGS
  # ==========================================================================
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: homelab
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      # Parse Docker JSON log format
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - output:
          source: output
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
      
      # Extract container name from path
      - regex:
          source: filename
          expression: '/var/lib/docker/containers/(?P<container_id>[^/]+)/.*'
      - labels:
          container_id:
  
  # ==========================================================================
  # AUDITD LOG MONITORING (Phase 4)
  # User creation, privilege escalation, file modifications
  # ==========================================================================
  
  - job_name: audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: audit
          host: homelab
          __path__: /var/log/audit/audit.log
    pipeline_stages:
      # Parse audit log basic structure
      - regex:
          expression: 'type=(?P<audit_type>\w+) msg=audit\((?P<audit_timestamp>[\d\.]+):(?P<audit_id>\d+)\):(?P<audit_message>.*)'
      
      - labels:
          audit_type:
          audit_id:
      
      # Parse timestamp
      - timestamp:
          source: audit_timestamp
          format: Unix
      
      # Extract audit key (identifies rule that triggered)
      - regex:
          expression: '.*key="(?P<audit_key>[\w_]+)"'
          source: audit_message
      - labels:
          audit_key:
      
      # Extract user IDs
      - regex:
          expression: '.*auid=(?P<audit_auid>\d+).*uid=(?P<audit_uid>\d+).*gid=(?P<audit_gid>\d+)'
          source: audit_message
      - labels:
          audit_auid:
          audit_uid:
      
      # USER CREATION PARSING (EXECVE type with useradd)
      - match:
          selector: '{job="audit", audit_type="EXECVE", audit_key="user_creation"}'
          stages:
            - regex:
                expression: '.*a0="(?P<user_mgmt_command>\w+)".*a2="(?P<new_username>[\w\-]+)"'
                source: audit_message
            - labels:
                user_mgmt_command:
                new_username:
            - labels:
                user_event_type: user_created
      
      # USER DELETION PARSING
      - match:
          selector: '{job="audit", audit_type="EXECVE", audit_key="user_deletion"}'
          stages:
            - regex:
                expression: '.*a0="(?P<user_mgmt_command>\w+)".*a1="(?P<deleted_username>[\w\-]+)"'
                source: audit_message
            - labels:
                user_mgmt_command:
                deleted_username:
            - labels:
                user_event_type: user_deleted
      
      # USER MODIFICATION PARSING
      - match:
          selector: '{job="audit", audit_type="EXECVE", audit_key="user_modification"}'
          stages:
            - regex:
                expression: '.*a0="(?P<user_mgmt_command>\w+)"'
                source: audit_message
            - labels:
                user_mgmt_command:
            - labels:
                user_event_type: user_modified
      
      # PASSWORD CHANGE PARSING
      - match:
          selector: '{job="audit", audit_type="EXECVE", audit_key="password_change"}'
          stages:
            - regex:
                expression: '.*a0="(?P<password_command>\w+)"'
                source: audit_message
            - labels:
                password_command:
            - labels:
                user_event_type: password_changed
      
      # FILE MODIFICATION PARSING (PATH type)
      - match:
          selector: '{job="audit", audit_type="PATH"}'
          stages:
            - regex:
                expression: '.*name="(?P<audit_file_path>[^"]+)".*mode=(?P<file_mode>\d+)'
                source: audit_message
            - labels:
                audit_file_path:
                file_mode:
      
      # SUID/SGID BIT CHANGES
      - match:
          selector: '{job="audit", audit_key="suid_sgid_set"}'
          stages:
            - labels:
                priv_escalation_type: suid_sgid_set
      
      # SUID BINARY TAMPERING
      - match:
          selector: '{job="audit", audit_key="suid_binary_change"}'
          stages:
            - labels:
                priv_escalation_type: suid_binary_tamper
      
      # SU COMMAND USAGE
      - match:
          selector: '{job="audit", audit_key="su_usage"}'
          stages:
            - labels:
                priv_escalation_type: su_executed
      
      # CAPABILITY CHANGES
      - match:
          selector: '{job="audit", audit_key="capability_change"}'
          stages:
            - labels:
                priv_escalation_type: capability_modified
      
      # OWNERSHIP CHANGES
      - match:
          selector: '{job="audit", audit_key="ownership_change"}'
          stages:
            - regex:
                expression: '.*a0="(?P<chown_path>[^"]+)"'
                source: audit_message
            - labels:
                chown_path:
            - labels:
                priv_escalation_type: ownership_changed
  
  # ==========================================================================
  # ENHANCED SYSLOG MONITORING (Phase 4)
  # Captures output from AIDE, process monitor, SUID checker via logger
  # ==========================================================================
  
  # NOTE: This extends the existing syslog job above with security tool monitoring
  # The following pipeline stages should be added to the existing syslog job
  # For now, creating a separate job to avoid conflicts during initial deployment
  
  - job_name: syslog_security
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog_security
          host: homelab
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\w+)\s+(?P<process>[\w\-\[\]]+):\s+(?P<message>.*)$'
      - labels:
          process:
      - timestamp:
          source: timestamp
          format: 'Jan _2 15:04:05'
      
      # AIDE EVENTS
      - match:
          selector: '{job="syslog_security", process="aide"}'
          stages:
            - regex:
                expression: 'AIDE: (?P<aide_changed>\d+) changed, (?P<aide_added>\d+) added, (?P<aide_removed>\d+) removed'
                source: message
            - labels:
                security_tool: aide
      
      # PROCESS MONITOR EVENTS
      - match:
          selector: '{job="syslog_security", process="process_monitor"}'
          stages:
            - regex:
                expression: 'New process detected: (?P<new_process_name>\w+)'
                source: message
            - labels:
                new_process_name:
                security_tool: process_monitor
      
      # SUID MONITOR EVENTS
      - match:
          selector: '{job="syslog_security", process="suid_monitor"}'
          stages:
            - regex:
                expression: 'NEW SUID/SGID binary detected: (?P<suid_file_path>.+)'
                source: message
            - labels:
                suid_file_path:
                security_tool: suid_monitor
      
      # CAPABILITY MONITOR EVENTS
      - match:
          selector: '{job="syslog_security", process="capability_monitor"}'
          stages:
            - regex:
                expression: 'NEW capability detected: (?P<capability_file>.+)'
                source: message
            - labels:
                capability_file:
                security_tool: capability_monitor
