name: Deploy to Tailscale Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and Stow Dotfiles
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TAILSCALE_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/Homelab || exit 1
            git pull origin main

            # Stow dotfiles if directory exists
            if [ -d "dotfiles" ]; then
              cd dotfiles
              stow --restow */
              echo "Dotfiles stowed successfully"
            else
              echo "No dotfiles directory found, skipping stow"
            fi

            echo "Deployment completed"
