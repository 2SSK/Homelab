name: Deploy to Tailscale Server
on:
  push:
    branches:
      - main

env:
  SSH_HOST: ${{ secrets.TAILSCALE_SERVER_IP }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Test Tailscale connection
        run: |
          tailscale status
          ping -c 3 ${{ secrets.TAILSCALE_SERVER_IP }}

      - name: Pull Latest Changes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/Homelab || exit 1
            git pull origin main
            echo "Repository updated successfully"

      - name: Stow Dotfiles
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/Homelab || exit 1
            rm -rf /home/${{ secrets.SSH_USER }}/dotfiles || exit 1
            cp -r dotfiles /home/${{ secrets.SSH_USER }}/ || exit 1
            cd /home/${{ secrets.SSH_USER }}/dotfiles || exit 1
            stow . || exit 1
            echo "Dotfiles stowed successfully"
